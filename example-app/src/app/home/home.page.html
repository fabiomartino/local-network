<ion-header>
  <ion-toolbar>
    <ion-title>Capacitor Plugins Demo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Capacitor Plugins</ion-title>
    </ion-toolbar>
  </ion-header>
  <app-about-card
    title="About this demo"
    subtitle="@capacitor-community/local-network"
    content="Angular + Ionic demo showing how to check, request and listen for the Android 17+ local network permission (ACCESS_LOCAL_NETWORK)."
    githubUrl="https://github.com/capacitor-community/local-network"
  />
  <ion-list-header>
    <ion-label>Plugins</ion-label>
  </ion-list-header>
  <ion-list lines="none">
    @for (plugin of plugins(); track $index) {
      <ion-item
        [button]="plugin.active"
        [routerLink]="plugin.active ? [plugin.pathName] : null"
        [class.inactive-item]="!plugin.active"
      >
        <ion-icon slot="start" [name]="plugin.iconName" size="large" />
        <ion-label>
          {{ plugin.npmName }}
          <p>
            <ion-text>{{ plugin.description }}</ion-text>
          </p>
        </ion-label>
      </ion-item>
    }
  </ion-list>

</ion-content>
<app-page-footer [version]="appVersion()" label="App Version" />
